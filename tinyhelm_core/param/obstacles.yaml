tinyhelm_scan_to_reliable_cloud:
    frame: laser

     # points used for new obstacle detections
    scan_topic: /scan_filtered
    cloud_topic: /reliable_cloud

tinyhelm_scan_to_unreliable_cloud:
    frame: laser

    # points used only for keeping existing detections alive
    scan_topic: /scan_filtered
    cloud_topic: /unreliable_cloud

tinyhelm_costmap:
    resolution: 0.5

    # Side of the local window in metres. Information leaves at the trailing edge as we move and is
    # not recoverable, which is the accepted trade for never maintaining anything we sailed away from.
    extent: 120.0

    # Distance over which the soft standoff penalty falls away to nothing, and therefore also the
    # standoff a route settles at in open water. Distances are only ever tracked this far, so it also
    # bounds how much of the map one changed cell can affect.
    # Must match tinyhelm_planner/soft_radius: it is the range the published grid is encoded over.
    soft_radius: 6.0

    # Evidence is measured in seconds observed, not in hits. A cell earns at most one credit per
    # confirm_period however many returns land in it, which is the only thing that separates a piling
    # from a workboat crossing our bow: both put the same number of returns into a cell.
    confirm_period: 0.2

    # How long something must be seen before it counts as an obstacle.
    confirm_seconds: 0.8

    # Credit ceiling. This bounds how long anything survives after it stops being seen, so a brief
    # smear clears quickly while a structure watched for minutes persists.
    memory_seconds: 60.0

    # Gap in observations tolerated before we start doubting a cell. Covers beam wander in swell and
    # brief occlusion, so a structure glimpsed intermittently holds its evidence between sightings.
    grace_seconds: 3.0

    # Seconds of silence needed to burn one second of accumulated credit.
    forget_seconds: 2.0

    # The window only follows the vessel once it has moved this many cells, so working back and forth
    # over a boundary does not shed the trailing edge repeatedly.
    scroll_hysteresis_cells: 5

    publish_rate: 10.0

tinyhelm_planner:
    # Must match tinyhelm_costmap/soft_radius.
    soft_radius: 6.0

    # Downsampling factor for the heuristic layer. Only ever used to estimate cost, never to produce
    # geometry, and everything about it errs optimistic, so a row of marina piles stays passable
    # instead of merging into a wall.
    coarse_factor: 4

    # How often an obstruction is restated while it persists.
    status_period: 1.0

tinyhelm_obstacles:
    # Full param path the usable corridor width is read from at runtime, has to point at the active
    # controller. This is the clearance a route must keep: the vessel may sit anywhere within its
    # allowed divergence under wind or current, so the corridor has to be clear wherever it ends up.
    divergence_param: /tinyhelm_waypoints/max_line_divergence

    # Must match tinyhelm_planner/soft_radius.
    soft_radius: 6.0

    # How far off its line the vessel may ever be routed. Flat on purpose: it also bounds the region a
    # search has to cover, so scaling it with leg length made long transits ruinously slow. There is no
    # expansion limit any more, because this is what bounds the work.
    max_lateral_detour: 20.0

    # Consecutive failed attempts on a waypoint before giving up on it and routing to the next.
    unreachable_cycles: 3

    waypoint_reached_radius: 6.0

    # A request left unanswered this long is resent, and dropped after this many retries.
    request_timeout: 2.0
    request_retries: 2
