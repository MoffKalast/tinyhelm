tinyhelm_scan_to_reliable_cloud:
    frame: laser

     # points used for new obstacles
    scan_topic: /scan_verified
    cloud_topic: /reliable_cloud

tinyhelm_scan_to_unreliable_cloud:
    frame: laser

    # points used only for keeping existing detections alive
    scan_topic: /scan_filtered
    cloud_topic: /unreliable_cloud

tinyhelm_obstacles:

    # Cell size for obstacle tracking
    costmap_resolution: 0.5

    # Side of the local window in metres. Information leaves at the trailing edge as we move
    costmap_size: 150.0

    # The window only follows the vessel once it has moved this many cells, so working back and forth over a boundary does not shed the trailing edge repeatedly.
    scroll_hysteresis_cells: 5

    # Distance over which the soft standoff penalty falls away to nothing on the costmap
    soft_radius: 8.0

    # Evidence is measured in seconds observed, not in hits. A cell earns at most one credit per confirm_period however many returns land in it.
    confirm_period: 0.2

    # How long something must be seen before it counts as an obstacle.
    confirm_seconds: 0.8

    # Max total accumulated seconds per cell.
    memory_seconds: 120.0

    # Gap in observations tolerated before we start decaying a cell.
    grace_seconds: 3.0

    # Seconds of silence needed to undo one second of observation.
    forget_ratio: 2.0

    # Downsampling factor for the heuristic layer. Only ever used to estimate cost, 4 * 0.5 m = 2 m cells
    coarse_factor: 4

    # How often an obstruction is restated while it persists.
    status_period: 1.0

    # Full param path read from at runtime, has to point at the active controller. Defines the width of the corridor that must be kept clear.
    divergence_param: /tinyhelm_waypoints/max_line_divergence

    # Fallback option if divergence_param cannot be loaded
    robot_width: 1.0

    # How far off its line the vessel is allowed to replan, forms a capsule around each leg of the mission.
    max_lateral_detour: 20.0

    # A request left unanswered this long is resent, and dropped after this many retries.
    request_timeout: 2.0
    request_retries: 2
